services:
  db:
    image: postgres:16-alpine
    container_name: oktateszt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oktateszt
      POSTGRES_PASSWORD: oktateszt
      POSTGRES_DB: oktateszt
    ports:
      - "5432:5432"
    volumes:
      - oktateszt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oktateszt -d oktateszt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oktateszt-pgdata:
